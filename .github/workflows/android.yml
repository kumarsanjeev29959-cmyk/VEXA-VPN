name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VEXA_KEYSTORE_PATH: ${{ github.workspace }}/.signing/vexa-release.jks
  VEXA_KEY_ALIAS: ${{ secrets.VEXA_KEY_ALIAS }}
  VEXA_KEYSTORE_PASSWORD: ${{ secrets.VEXA_KEYSTORE_PASSWORD }}
  VEXA_KEY_PASSWORD: ${{ secrets.VEXA_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        if: ${{ secrets.VEXA_KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing
          printf '%s' '${{ secrets.VEXA_KEYSTORE_B64 }}' | base64 --decode > "$VEXA_KEYSTORE_PATH"
          chmod 600 "$VEXA_KEYSTORE_PATH"

      - name: Run unit tests
        run: gradle --no-daemon test

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Verify release is signed
        if: ${{ secrets.VEXA_KEYSTORE_B64 != '' }}
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Generate release checksum
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
          else
            sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vexa-vpn-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          if-no-files-found: error
          retention-days: 14
