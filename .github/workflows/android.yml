name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VEXA_KEYSTORE_PATH: ${{ github.workspace }}/.signing/vexa-release.jks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare release signing key
        shell: bash
        env:
          VEXA_KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          VEXA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VEXA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VEXA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${VEXA_KEYSTORE_B64:-}" ]; then
            echo "Release signing secrets are not configured; release will remain unsigned."
            exit 0
          fi

          if [ -z "${VEXA_KEY_ALIAS:-}" ] || [ -z "${VEXA_KEYSTORE_PASSWORD:-}" ] || [ -z "${VEXA_KEY_PASSWORD:-}" ]; then
            echo "KEYSTORE_BASE64 exists, but one or more signing credentials are missing."
            exit 1
          fi

          mkdir -p .signing
          printf '%s' "$VEXA_KEYSTORE_B64" | base64 --decode > "$VEXA_KEYSTORE_PATH"
          chmod 600 "$VEXA_KEYSTORE_PATH"
          touch .signing/release-signing-enabled

          keytool -list -keystore "$VEXA_KEYSTORE_PATH" \
            -alias "$VEXA_KEY_ALIAS" \
            -storepass "$VEXA_KEYSTORE_PASSWORD" \
            >/dev/null

      - name: Run unit tests
        run: gradle --no-daemon test

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        env:
          VEXA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VEXA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VEXA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify release signing
        if: ${{ hashFiles('.signing/release-signing-enabled') != '' }}
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Generate release checksum
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
          else
            sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vexa-vpn-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$VEXA_KEYSTORE_PATH" .signing/release-signing-enabled
