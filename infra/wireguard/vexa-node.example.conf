[Interface]
Address = 10.64.0.1/16
ListenPort = 51820
PrivateKey = <GENERATE_ON_NODE>

# Enable IPv4 forwarding and NAT on the host. Example nftables policy:
#   sysctl -w net.ipv4.ip_forward=1
#   nft add table ip nat
#   nft 'add chain ip nat postrouting { type nat hook postrouting priority 100; }'
#   nft add rule ip nat postrouting oifname "<WAN_IFACE>" ip saddr 10.64.0.0/16 masquerade
# Restrict firewall rules to UDP/51820 and established traffic as appropriate.

# Per-device [Peer] blocks are installed dynamically by the VEXA node agent.
