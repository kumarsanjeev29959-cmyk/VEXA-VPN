openapi: 3.0.3
info:
  title: VEXA VPN API
  version: 1.0.0
  description: Device-based backend contract for server discovery and WireGuard peer provisioning. End users do not log in or register with email/password.
servers:
  - url: https://api.example.com
paths:
  /v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/servers:
    get:
      summary: List available VPN servers
      security:
        - deviceToken: []
      responses:
        '200':
          description: Server list
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/VpnServer'
        '401':
          description: Invalid or expired device token
  /v1/devices:
    post:
      summary: Provision a device without an end-user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionDeviceRequest'
      responses:
        '201':
          description: Device provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceProvisioningResponse'
        '400':
          description: Invalid device identity
  /v1/vpn/config:
    post:
      summary: Allocate a server and issue device-specific WireGuard peer information
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VpnConfigRequest'
      responses:
        '200':
          description: WireGuard peer information issued; the client private key is never sent to the backend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VpnConfigResponse'
        '401':
          description: Invalid or expired device token
        '403':
          description: Device identity does not match the provisioned identity
        '503':
          description: No healthy VPN server is available
  /v1/node/jobs:
    get:
      summary: Fetch pending peer jobs for a VPN node agent
      security:
        - nodeToken: []
      responses:
        '200':
          description: Pending peer jobs
  /v1/node/jobs/ack:
    post:
      summary: Acknowledge a VPN node peer job
      security:
        - nodeToken: []
      responses:
        '200':
          description: Job acknowledgement accepted
components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: device-token
    nodeToken:
      type: apiKey
      in: header
      name: X-VEXA-Node-Token
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: vexa-control-plane }
    VpnServer:
      type: object
      required: [id, name, countryCode, city, hostname, port, protocol, premium, healthy, loadPercent]
      properties:
        id: { type: string, example: in-patna-01 }
        name: { type: string, example: India - Patna 01 }
        countryCode: { type: string, example: IN }
        city: { type: string, example: Patna }
        hostname: { type: string, example: in-patna-01.vexa.example }
        port: { type: integer, minimum: 1, maximum: 65535, example: 51820 }
        protocol: { type: string, enum: [wireguard] }
        premium: { type: boolean }
        healthy: { type: boolean }
        loadPercent: { type: integer, minimum: 0, maximum: 100 }
        latencyMs: { type: integer, minimum: 0, nullable: true }
    ProvisionDeviceRequest:
      type: object
      required: [deviceId, publicKey]
      properties:
        deviceId: { type: string, minLength: 8, maxLength: 128 }
        publicKey: { type: string, minLength: 43, maxLength: 44 }
        deviceName: { type: string, maxLength: 100 }
        platform: { type: string, enum: [android] }
        appVersion: { type: string, maxLength: 32 }
    DeviceProvisioningResponse:
      type: object
      required: [deviceToken, deviceId, expiresAt]
      properties:
        deviceToken:
          type: string
          description: Opaque device-scoped credential. Store only on the device and never log it.
        deviceId: { type: string }
        expiresAt: { type: string, format: date-time }
    VpnConfigRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId: { type: string }
        serverId: { type: string, nullable: true }
        fastest: { type: boolean, default: true }
    VpnPeer:
      type: object
      required: [serverPublicKey, address, dns, allowedIPs, persistentKeepalive]
      properties:
        serverPublicKey: { type: string, minLength: 43, maxLength: 44 }
        address: { type: string, example: 10.64.0.2/32 }
        dns: { type: string, example: 1.1.1.1 }
        allowedIPs: { type: string, example: '0.0.0.0/0, ::/0' }
        persistentKeepalive: { type: integer, minimum: 0, maximum: 65535, example: 25 }
    VpnConfigResponse:
      type: object
      required: [server, peer, expiresAt]
      properties:
        server: { $ref: '#/components/schemas/VpnServer' }
        peer: { $ref: '#/components/schemas/VpnPeer' }
        expiresAt: { type: string, format: date-time }
